 la documentation existante (Illustrious 18, tableaux d'indices, calculs de bankroll) est \xE9crite pour lui.","Corr\xE9lation de mise de 0,97 : on ne gagne presque rien \xE0 passer \xE0 un syst\xE8me plus lourd."],inconvenients:["Le calcul du vrai compte \xE0 chaque main demande de l'entra\xEEnement, surtout l'estimation des paquets restants.","L'As et le 10 partagent la m\xEAme valeur, alors qu'ils n'ont pas le m\xEAme r\xF4le : l'As sert au blackjack, le 10 sert aux doublements.","Efficacit\xE9 de jeu moyenne (0,51) : sans les indices de d\xE9viation, une partie du gain est laiss\xE9e sur la table."],pourQui:"Tout le monde, et en particulier si vous d\xE9butez. Il n'existe aucune raison s\xE9rieuse de commencer ailleurs.",conseils:["Entra\xEEnez-vous par paires qui s'annulent : un 5 et un Roi vus ensemble font 0, inutile de compter deux fois.","Estimez les paquets restants au tiers de paquet pr\xE8s en regardant la pile de cartes br\xFBl\xE9es, pas les cartes du sabot.","Les 18 indices ci-dessous apportent l'essentiel du gain de l'efficacit\xE9 de jeu \u2014 l'assurance \xE0 elle seule en repr\xE9sente environ un tiers."],indices:[["Assurance","ne pas prendre","prendre","+3"],["16 contre 10","tirer","rester","0"],["15 contre 10","tirer","rester","+4"],["10-10 contre 5","rester","s\xE9parer","+5"],["10-10 contre 6","rester","s\xE9parer","+4"],["10 contre 10","tirer","doubler","+4"],["12 contre 3","tirer","rester","+2"],["12 contre 2","tirer","rester","+3"],["11 contre As","tirer","doubler","+1"],["9 contre 2","tirer","doubler","+1"],["10 contre As","tirer","doubler","+4"],["9 contre 7","tirer","doubler","+3"],["16 contre 9","tirer","rester","+5"],["13 contre 2","rester","tirer","\u22121"],["12 contre 4","rester","tirer","0"],["12 contre 5","rester","tirer","\u22122"],["12 contre 6","rester","tirer","\u22121"],["13 contre 3","rester","tirer","\u22122"]],fab4:[["14 contre 10","+3"],["15 contre 10","0"],["15 contre 9","+2"],["15 contre As","+1"]]},ko:{id:"ko",nom:"KO (Knock-Out)",sous:"Sans division",niveau:1,equilibre:!1,tc:!1,asSepare:!1,couleurRequise:!1,precision:4,complexite:1,bc:"0,98",pe:"0,55",ic:"0,78",pivot:4,irc:e=>4-4*e,valeurs:{A:-1,2:1,3:1,4:1,5:1,6:1,7:1,8:0,9:0,[at]:-1},resume:"Le Hi-Lo avec le 7 \xE0 +1. Ce d\xE9s\xE9quilibre volontaire supprime la division par les paquets restants : on mise directement sur le compte courant, avec un pivot fixe \xE0 +4.",fonctionnement:"Identique au Hi-Lo \xE0 une carte pr\xE8s : le 7 vaut +1 au lieu de 0. Le compte ne revient donc plus \xE0 z\xE9ro en fin de sabot, il d\xE9rive vers le haut. On compense en d\xE9marrant \xE0 un compte initial n\xE9gatif qui d\xE9pend du nombre de paquets \u2014 pour six paquets, on part de \u221220. Le pivot, c'est-\xE0-dire le point o\xF9 votre esp\xE9rance devient positive, tombe alors toujours sur +4, quel que soit le nombre de paquets. \xC0 partir de l\xE0, on monte la mise par paliers sur le compte courant, sans jamais diviser.",avantages:["Aucune division en cours de partie : c'est l'obstacle num\xE9ro un du comptage qui dispara\xEEt.","Charge mentale minimale, donc moins d'erreurs sur de longues sessions \u2014 et une erreur co\xFBte plus cher qu'un syst\xE8me impr\xE9cis.","Corr\xE9lation de mise quasiment identique au Hi-Lo.","Le compte se lit tel quel, ce qui rend les d\xE9cisions de mise tr\xE8s rapides."],inconvenients:["Pas d'autocontr\xF4le : le compte ne revient pas \xE0 z\xE9ro, une erreur passe inaper\xE7ue.","Le compte initial change avec le nombre de paquets, il faut le recalculer \xE0 chaque changement de table.","Les indices de d\xE9viation sont moins pr\xE9cis qu'avec un vrai compte, sauf pr\xE8s du pivot.","Moins de documentation disponible que pour le Hi-Lo."],pourQui:"Ceux que le calcul du vrai compte bloque, et ceux qui jouent en conditions bruyantes ou sur de tr\xE8s longues sessions.",conseils:["Retenez la formule du compte initial : 4 \u2212 4 \xD7 (nombre de paquets).","Le pivot \xE0 +4 est votre rep\xE8re unique : en dessous, mise minimale ; au-dessus, vous montez.","Prenez l'assurance d\xE8s que le compte courant atteint le pivot."]},red7:{id:"red7",nom:"Red 7",sous:"D\xE9s\xE9quilibr\xE9, pivot \xE0 z\xE9ro",niveau:1,equilibre:!1,tc:!1,asSepare:!1,couleurRequise:!0,precision:4,complexite:2,bc:"0,98",pe:"0,54",ic:"0,78",pivot:0,irc:e=>-2*e,valeurs:{A:-1,2:1,3:1,4:1,5:1,6:1,8:0,9:0,[at]:-1},valeurSpeciale:{rang:7,rouge:1,noir:0},resume:"Comme le Hi-Lo, mais seuls les 7 rouges valent +1 (les noirs valent 0). Syst\xE8me d\xE9s\xE9quilibr\xE9 \xE0 pivot z\xE9ro : d\xE8s que le compte devient positif, vous avez l'avantage.",fonctionnement:"Petites cartes 2 \xE0 6 \xE0 +1, hautes cartes \xE0 \u22121, 8 et 9 neutres, et le 7 d\xE9doubl\xE9 : rouge il vaut +1, noir il vaut 0. On d\xE9marre \xE0 \u22122 par paquet, ce qui place le pivot exactement sur z\xE9ro. La lecture devient donc binaire et imm\xE9diate : compte n\xE9gatif, vous \xEAtes en dessous de l'esp\xE9rance ; compte positif, vous \xEAtes au-dessus. Aucune division n'est n\xE9cessaire.",avantages:["Pivot \xE0 z\xE9ro : le signe du compte suffit \xE0 savoir o\xF9 vous en \xEAtes, c'est la lecture la plus rapide qui existe.","Pas de vrai compte \xE0 calculer.","Pr\xE9cision comparable au Hi-Lo pour la mise.","Le compte initial se retient facilement : \u22122 par paquet."],inconvenients:["Il faut voir la couleur des 7, ce qui ajoute une donn\xE9e visuelle sur des cartes distribu\xE9es vite.","Comme tout syst\xE8me d\xE9s\xE9quilibr\xE9, pas de retour \xE0 z\xE9ro pour v\xE9rifier son comptage.","Le d\xE9doublement du 7 est la source d'erreur la plus fr\xE9quente chez les d\xE9butants."],pourQui:"Une bonne alternative au KO si vous pr\xE9f\xE9rez un pivot \xE0 z\xE9ro. \xC0 \xE9viter si les tables o\xF9 vous jouez sont mal \xE9clair\xE9es ou si le croupier ramasse vite.",conseils:["Entra\xEEnez-vous d'abord sans les 7, puis r\xE9introduisez-les une fois le reste automatique.","Une variante existe o\xF9 l'on compte tous les 7 \xE0 +\xBD : plus pr\xE9cise, mais elle r\xE9introduit les fractions."]},hiopt1:{id:"hiopt1",nom:"Hi-Opt I",sous:"As neutralis\xE9",niveau:1,equilibre:!0,tc:!0,asSepare:!0,couleurRequise:!1,precision:4,complexite:3,bc:"0,88",pe:"0,61",ic:"0,85",valeurs:{A:0,2:0,3:1,4:1,5:1,6:1,7:0,8:0,9:0,[at]:-1},resume:"L'As sort du compte principal et se suit \xE0 part. Meilleure efficacit\xE9 de jeu que le Hi-Lo, mais la mise devient mauvaise si vous n\xE9gligez le comptage annexe des As.",fonctionnement:"Seuls les 3, 4, 5 et 6 comptent +1 ; seules les cartes valant 10 comptent \u22121. Le 2, le 7, le 8, le 9 et l'As sont neutres. En retirant l'As du compte, on obtient un indicateur bien plus fid\xE8le de la richesse en cartes de valeur 10, ce qui am\xE9liore les d\xE9cisions de jeu. En contrepartie, l'As est d\xE9cisif pour les blackjacks, donc pour la mise : il faut le suivre sur un compteur s\xE9par\xE9 et corriger le vrai compte en fonction du surplus ou du d\xE9ficit d'As restants.",avantages:["Efficacit\xE9 de jeu de 0,61, nettement sup\xE9rieure au Hi-Lo.","Corr\xE9lation d'assurance de 0,85 : la d\xE9cision la plus rentable devient plus fiable.","Syst\xE8me \xE9quilibr\xE9, donc v\xE9rifiable en fin de sabot.","Les valeurs restent \xE0 un seul niveau."],inconvenients:["Sans comptage annexe des As, la corr\xE9lation de mise chute \xE0 0,88 : moins bon que le Hi-Lo.","Tenir deux compteurs simultan\xE9ment est une vraie difficult\xE9, souvent sous-estim\xE9e.","Le b\xE9n\xE9fice net sur un jeu \xE0 plusieurs paquets est faible par rapport au Hi-Lo bien jou\xE9."],pourQui:"Joueurs d\xE9j\xE0 \xE0 l'aise avec le Hi-Lo qui jouent sur peu de paquets, l\xE0 o\xF9 l'efficacit\xE9 de jeu p\xE8se davantage.",conseils:["Suivez les As avec les doigts sur les jetons plut\xF4t qu'en m\xE9moire, pour lib\xE9rer votre attention.","Correction usuelle : ajoutez au vrai compte le nombre d'As exc\xE9dentaires par paquet restant.","Ne passez \xE0 ce syst\xE8me que si votre Hi-Lo est parfaitem ui \xE9vite d'avoir \xE0 le suivre s\xE9par\xE9ment.",avantages:["Corr\xE9lation de mise 0,96 et efficacit\xE9 de jeu 0,63 : les deux qualit\xE9s \xE0 la fois.","Aucun comptage annexe, contrairement aux autres syst\xE8mes de niveau 2.","\xC9quilibr\xE9 et donc v\xE9rifiable en fin de sabot."],inconvenients:["Deux niveaux \xE0 m\xE9moriser, avec un temps d'adaptation notable apr\xE8s le Hi-Lo.","Le vrai compte reste n\xE9cessaire.","Moins de tableaux d'indices publi\xE9s que pour le Hi-Lo."],pourQui:"La progression naturelle apr\xE8s le Hi-Lo, pour qui veut gagner en pr\xE9cision sans g\xE9rer deux compteurs.",conseils:["La transition demande une \xE0 deux semaines : ne jouez pas en argent r\xE9el pendant cette p\xE9riode.","Les paires qui s'annulent restent utiles : un 4 et un Roi font 0."]},halves:{id:"halves",nom:"Wong Halves",sous:"Niveau 3, pr\xE9cision maximale",niveau:3,equilibre:!0,tc:!0,asSepare:!1,couleurRequise:!1,precision:5,complexite:5,bc:"0,99",pe:"0,57",ic:"0,72",valeurs:{A:-1,2:.5,3:1,4:1,5:1.5,6:1,7:.5,8:0,9:-.5,[at]:-1},resume:"Valeurs par demis, corr\xE9lation de mise de 0,99 \u2014 la plus \xE9lev\xE9e qui existe. Un syst\xE8me de d\xE9monstration plus que d'usage courant : les fractions ruinent la vitesse.",fonctionnement:"Chaque carte re\xE7oit une valeur proportionnelle \xE0 son influence r\xE9elle sur l'esp\xE9rance : +0,5 pour le 2 et le 7, +1 pour le 3, 4 et 6, +1,5 pour le 5, 0 pour le 8, \u22120,5 pour le 9, \u22121 pour les cartes de valeur 10 et l'As. Beaucoup de joueurs doublent toutes les valeurs pour travailler en nombres entiers, puis divisent le vrai compte par deux \xE0 la fin.",avantages:["Corr\xE9lation de mise de 0,99 : th\xE9oriquement le meilleur pour dimensionner les mises.","\xC9quilibr\xE9, donc contr\xF4lable.","Excellent exercice pour comprendre pourquoi chaque carte a le poids qu'elle a."],inconvenients:["Les demis, ou le doublement de toutes les valeurs, co\xFBtent une vitesse consid\xE9rable.","Le gain face au Hi-Lo e @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Public+Sans:ital,wght@0,400;0,500;0,700;1,400&family=JetBrains+Mono:wght@400;700&display=swap');

.bjc {
  font-family:'Public Sans', ui-sans-serif, system-ui, -apple-system, sans-serif;
  color:var(--encre); background:var(--papier); min-height:100vh;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
  transition:background-color .2s ease, color .2s ease;
}
.bjc *, .bjc *::before, .bjc *::after { box-sizing:border-box; }
.bjc h1,.bjc h2,.bjc h3 { font-family:'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif; margin:0; letter-spacing:-.02em; }
.bjc .mono { font-family:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric:tabular-nums; }
.bjc button { font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; touch-action:manipulation; }
.bjc select { font-family:inherit; color:var(--encre); }
.bjc button:focus-visible, .bjc select:focus-visible, .bjc [tabindex]:focus-visible { outline:2px solid var(--or); outline-offset:2px; }

.bjc-nav button { position:relative; padding:14px 2px 12px; font-size:12px; font-weight:700;
  letter-spacing:.09em; text-transform:uppercase; color:var(--encre2); transition:color .15s; }
.bjc-nav button[data-actif="1"] { color:var(--encre); }
.bjc-nav button[data-actif="1"]::after { content:''; position:absolute; left:0; right:0; bottom:-1px; height:2px; background:var(--encre); }

.bjc-tap { transition:transform .08s ease; }
.bjc-tap:active { transform:scale(.96); }
.bjc-ligne:hover { background:var(--survol); }

.bjc-pop { animation:bjc-pop .14s ease-out; }
@keyframes bjc-pop { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:none; } }
.bjc-flash { animation:bjc-flash .18s ease-out; }
@keyframes bjc-flash { from { opacity:0; transform:scale(.94); } to { opacity:1; transform:none; } }

@media (hover:hover) { .bjc-tap:hover { transform:translateY(-2px); } }
@media (prefers-reduced-motion: reduce) {
  .bjc *, .bjc *::before, .bjc *::after { animation:none !important; transition:none !important; }
  .bjc-tap:hover, .bjc-tap:active { transform:none; }
}

it une erreur. Elle impose en revanche la division par les paquets restants. Un syst\xE8me d\xE9s\xE9quilibr\xE9 renonce \xE0 ce contr\xF4le pour supprimer la division."},{terme:"Compte initial et pivot",alias:"irc initial running count pivot d\xE9s\xE9quilibr\xE9",court:"Le point de d\xE9part et le seuil de bascule d'un syst\xE8me d\xE9s\xE9quilibr\xE9.",long:"Le compte initial compense volontairement le d\xE9s\xE9quilibre : \u221220 pour six paquets au KO, \u22122 par paquet au Red 7. Le pivot est le compte \xE0 partir duquel votre esp\xE9rance devient positive : +4 au KO, 0 au Red 7. Comme ce pivot est fixe, il remplace le calcul du vrai compte."},{terme:"Comptage annexe des As",alias:"side count ace as s\xE9par\xE9",court:"Un second compteur, tenu en parall\xE8le du premier, qui suit uniquement les As.",long:"N\xE9cessaire aux syst\xE8mes qui neutralisent l'As, comme le Hi-Opt et l'Omega II. On compare les As vus \xE0 ceux attendus, et on corrige le vrai compte \xE0 la hausse si le sabot en est riche. Tenir deux compteurs simultan\xE9ment est bien plus difficile qu'il n'y para\xEEt \u2014 c'est la principale raison pour laquelle ces syst\xE8mes d\xE9\xE7oivent en pratique."},{terme:"Niveau d'un syst\xE8me",alias:"level multi-niveau tags valeurs",court:"La plus grande valeur absolue attribu\xE9e \xE0 une carte.",long:"Le Hi-Lo est de niveau 1 : uniquement +1, 0 et \u22121. Le Zen et l'Omega II sont de niveau 2, avec des \xB12. Le Wong Halves est de niveau 3 par ses demis. Chaque niveau suppl\xE9mentaire gagne un peu de pr\xE9cision et co\xFBte beaucoup de vitesse."}]},{groupe:"Mesurer un syst\xE8me",entrees:[{terme:"Effet du retrait",alias:"eor effect of removal",court:"De combien votre esp\xE9rance bouge quand une carte donn\xE9e quitte le sabot.",long:"C'est la grandeur fondamentale dont tout le reste d\xE9coule. Retirer un 5 vous fait gagner nettement plus que retirer un 8. Les valeurs de cartes d'un syst\xE8me ne sont qu'une approximation grossi\xE8re et m\xE9morisable de ces effets r\xE9els, et les trois corr\xE9lations ci-dessous mesurent la qualit\xE9 de cette approximation."},{terme:"Corr\xE9lation de mise",alias:"bc betting correlation",court:"\xC0 quel point le compte pr\xE9dit votre avantage r\xE9el, donc quand augmenter la mise.",long:"Une note entre 0 et 1. C'est l'indicateur le plus important sur un jeu \xE0 plusieurs paquets, parce que l'essentiel du gain d'un compteur vient de la variation de mise, pas des d\xE9viations. Le Hi-Lo est \xE0 0,97 : les syst\xE8mes plus lourds ne peuvent presque rien gagner de plus."},{terme:"Efficacit\xE9 de jeu",alias:"pe playing efficiency",court:"\xC0 quel point le compte indique correctement comment jouer chaque main.",long:"Le Hi-Lo est \xE0 0,51, le Hi-Opt II et l'Omega II \xE0 0,67. Le plafond th\xE9orique d'un compte unique tourne autour de 0,70. L'efficacit\xE9 de jeu compte surtout sur un ou deux paquets, o\xF9 les d\xE9cisions individuelles p\xE8sent lourd ; en sabot de six ou huit, elle passe derri\xE8re la corr\xE9lation de mise."},{terme:"Corr\xE9lation d'assurance",alias:"ic insurance correlation",court:"\xC0 quel point le compte estime la densit\xE9 r\xE9elle de cartes valant 10.",long:"L'assurance est le pari le plus rentable ouvert \xE0 un compteur \u2014 Schlesinger l'estime \xE0 environ un tiers du gain total des d\xE9viations. Un syst\xE8me qui isole bien les 10, comme le Hi-Opt II \xE0 0,91, y excelle. Le Wong Halves, qui m\xE9lange l'As aux 10, tombe \xE0 0,72."},{terme:"Pourquoi ces trois notes divergent",alias:"compromis arbitrage as ace",court:"Parce que l'As sert \xE0 miser mais presque pas \xE0 jouer.",long:"Un As restant dans le sabot augmente votre avantage : il fait les blackjacks, pay\xE9s 3:2. Mais il ne change presque rien \xE0 la fa\xE7on de jouer un 16 contre un 10. Un syst\xE8me qui compte l'As avec les 10 est donc excellent \xE0 la mise et m\xE9diocre au jeu ; un syst\xE8me qui le neutralise fait l'inverse. Aucun syst\xE8me ne maximise les trois notes \xE0 la fois, et c'est un fait math\xE9matique, pas un d\xE9faut de conception."}]},{groupe:"Jouer et miser",entrees:[{terme:"Indice de d\xE9viation",alias:"index illustrious 18 \xE9cart d\xE9viation",court:"Le vrai compte \xE0 partir duquel une d\xE9cision remplace celle de la strat\xE9gie de base.",long:"La strat\xE9gie de base suppose que vous ignorez tout du sabot. Le compte vous en apprend quelque chose, et certaines d\xE9cisions basculent. L'indice est le seuil de bascule. Exemple : le 16 contre 10 se tire en strat\xE9gie de base et se garde d\xE8s que le vrai compte atteint 0. Les indices d\xE9pendent du syst\xE8me de comptage et des r\xE8gles ; ceux du Hi-Lo ne se transposent pas au Zen."},{terme:"\xC9cart de mise",alias:"spread ramp variation",court:"Le rapport entre votre plus petite et votre plus grosse mise.",long:"Un \xE9cart de 1 \xE0 8 signifie que vous misez huit unit\xE9s au compte le plus favorable et une au plus d\xE9favorable. Sans \xE9cart suffisant, compter ne rapporte rien : c'est l\xE0 que se fait l'argent. Mais un \xE9cart large attire l'\u0153il, et c'est le principal signal que cherche la surveillance."},{terme:"Unit\xE9 et bankroll",alias:"capital mise unitaire",court:"L'unit\xE9 est votre mise de r\xE9f\xE9rence ; la bankroll, le capital total que vous acceptez d'exposer.",long:"Le rapport entre les deux d\xE9termine votre survie. Les ordres de grandeur usuels tournent autour de plusieurs centaines d'unit\xE9s de bankroll pour un \xE9cart de mise ambitieux. Sous-capitaliser est la fa\xE7on la plus commune de perdre en jouant pourtant correctement."},{terme:"Esp\xE9rance",alias:"ev expected value avantage",court:"Le gain ou la perte moyen par main, exprim\xE9 en fraction de la mise.",long:"Une esp\xE9rance de \u22120,5 % signifie que vous perdez en moyenne 50 centimes par tranche de 100 \u20AC mis\xE9e. Un compteur comp\xE9tent vise entre +0,5 % et +1,5 %. C'est une moyenne de long terme : elle ne dit rien de votre soir\xE9e."},{terme:"Variance",alias:"\xE9cart-type fluctuation risque de ruine",court:"L'ampleur des \xE9carts autour de cette moyenne.",long:"Au blackjack elle est brutale. Un avantage de 1 % est noy\xE9 dans des fluctuations bien plus grandes, et il faut des centaines d'heures pour que l'esp\xE9rance domine le bruit. Le risque de ruine est la probabilit\xE9 de perdre toute votre bankroll avant que cela n'arrive."},{terme:"Assurance",alias:"insurance pari annexe",court:"Un pari annexe propos\xE9 quand le croupier montre un As, pay\xE9 2:1.",long:"Il gagne si la carte cach\xE9e vaut 10. Comme cela arrive un peu moins d'une fois sur trois alors que le pari en exige un tiers, il est perdant en strat\xE9gie de base \u2014 toujours, sans exception. Il devient rentable au seul moment o\xF9 le sabot est r\xE9ellement riche en 10, ce que seul un compte peut vous dire."}]},{groupe:"La table",entrees:[{terme:"P\xE9n\xE9tration",alias:"penetration carte de coupe",court:"La proportion du sabot effectivement distribu\xE9e avant le m\xE9lange.",long:"Le param\xE8tre le plus important de tous, avant le choix du syst\xE8me. Elle se lit dans le bon sens : plus le pourcentage est \xE9lev\xE9, mieux c'est pour vous. \xC0 80 %, le croupier distribue huit dixi\xE8mes du sabot avant de m\xE9langer ; \xE0 50 %, il s'arr\xEAte \xE0 la moiti\xE9 et les comptes tr\xE8s favorables n'ont pas le temps d'appara\xEEtre. En ordre de grandeur, sous 60 % le comptage ne rapporte pratiquement rien, autour de 70 % il devient exploitable, au-del\xE0 de 75 % il devient int\xE9ressant. Regardez o\xF9 est plac\xE9e la carte de coupe avant de vous asseoir."},{terme:"M\xE9langeur continu",alias:"csm shuffle master machine",court:"Une machine qui r\xE9injecte les cartes jou\xE9es apr\xE8s chaque main.",long:"Le sabot ne s'\xE9puise jamais, donc la composition ne d\xE9rive jamais, donc il n'y a rien \xE0 compter. Aucun syst\xE8me ne fonctionne contre un m\xE9langeur continu. \xC0 ne pas confondre avec un m\xE9langeur automatique classique, qui pr\xE9pare le sabot suivant pendant que le premier se joue : celui-l\xE0 laisse le comptage intact."},{terme:"Main dure et main souple",alias:"hard soft as 11",court:"Une main est souple si elle contient un As encore comptable pour 11.",long:"A+6 est un 17 souple : tirer ne peut pas vous faire crever, l'As redescendra \xE0 1 si besoin. 10+7 est un 17 dur : tirer un 5 vous \xE9limine. C'est pourquoi les deux tableaux de strat\xE9gie sont diff\xE9rents, et pourquoi on double des mains souples qu'on n'oserait pas doubler dures."},{terme:"Hauteur du croupier",alias:"upcard carte visible",court:"La carte visible du croupier, celle sur laquelle repose toute votre d\xE9cision.",long:"Les hauteurs 2 \xE0 6 sont dites faibles : le croupier y cr\xE8ve entre 35 et 42 % du temps. De 7 \xE0 l'As, il est fort et vous devez souvent am\xE9liorer votre main m\xEAme au risque de crever."},{terme:"Carte cach\xE9e",alias:"hole card enhc obo europ\xE9en",court:"La seconde carte du croupier, servie face cach\xE9e et v\xE9rifi\xE9e avant que vous jouiez.",long:"L\xE0 o\xF9 elle existe, un blackjack du croupier interrompt le coup avant que vous n'engagiez de mise suppl\xE9mentaire. Sans elle, vos doublements et s\xE9parations sont expos\xE9s \u2014 sauf si la table vous les rend, une clause appel\xE9e \xAB mises initiales seulement \xBB qui restitue la strat\xE9gie am\xE9ricaine."},{terme:"Blackjack pay\xE9 3:2 ou 6:5",alias:"paiement naturel",court:"Le rapport auquel votre blackjack est pay\xE9.",long:"\xC0 3:2, un blackjack rapporte 15 \u20AC pour 10 mis\xE9s ; \xE0 6:5, seulement 12 \u20AC. Ce seul changement co\xFBte environ 1,4 % d'esp\xE9rance, soit davantage que tout ce qu'un comptage peut vous rapporter. Une table 6:5 est injouable, quel que soit votre niveau."},{terme:"Effet de la carte de coupe",alias:"cut card effect",court:"Un biais minime qui p\xE9nalise le joueur dans les jeux distribu\xE9s jusqu'\xE0 une carte de coupe.",long:"Quand un sabot est riche en petites cartes, les mains sont plus courtes et davantage de tours tiennent avant la coupe. Le joueur subit donc un peu plus souvent des sabots d\xE9favorables. L'effet se compte en centi\xE8mes de pourcent, et c'est pourquoi un m\xE9langeur continu abaisse paradoxalement l'avantage de la maison. Attention \xE0 ne pas confondre : cet effet oppose carte de coupe et m\xE9langeur, pas coupe profonde et coupe superficielle."},{terme:"La p\xE9n\xE9tration ne change rien \xE0 la strat\xE9gie de base",alias:"profondeur coupe esp\xE9rance non compteur",court:"Couper deux paquets sur six ne revient pas \xE0 jouer avec quatre paquets.",long:"Les cartes non distribu\xE9es sont m\xE9lang\xE9es au hasard parmi les autres : elles n'ont aucune raison d'\xEAtre plus riches en 10 que celles que vous voyez, donc elles ne portent aucune information. Votre esp\xE9rance en strat\xE9gie de base est identique \xE0 50 % et \xE0 75 % de p\xE9n\xE9tration, et le tableau ne bouge pas d'une case. La p\xE9n\xE9tration ne concerne que le comptage \u2014 mais elle le concerne plus que tout le reste."},{terme:"Back-counting",alias:"wonging observer entrer sortir",court:"Observer une table sans jouer et n'y entrer que sur compte favorable.",long:"Aussi appel\xE9 \xAB wonging \xBB, d'apr\xE8s Stanford Wong. Cela supprime les mains jou\xE9es \xE0 d\xE9savantage et am\xE9liore nettement le rendement horaire. Mais entrer et sortir d'une table selon le compte est extr\xEAmement visible, et beaucoup de casinos interdisent d\xE9sormais d'entrer en cours de sabot."}]}];function Ov({mobile:e,wrap:t}){let[n,r]=(0,z.useState)(""),[o,a]=(0,z.useState)([]),l=n.trim().toLowerCase(),u=c=>a(v=>v.includes(c)?v.filter(m=>m!==c):[...v,c]),s=Hv.map(c=>({...c,entrees:c.entrees.filter(v=>!l||v.terme.toLowerCase().includes(l)||v.alias.includes(l)||v.court.toLowerCase().includes(l)||v.long.toLowerCase().includes(l))})).filter(c=>c.entrees.length);return(0,i.jsxs)("div",{style:t,children:[(0,i.jsxs)("div",{style:{padd
